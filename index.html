<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Sofi ❤️</title> 	
  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      background:#0b1028;
      color:white;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    button{
      padding:16px 28px;
      border:none;
      border-radius:999px;
      background:#ff7cb3;
      color:white;
      font-size:18px;
    }
  </style>
</head>
<body>

  <h1 id="title">Sofi...</h1>
  <p id="subtitle">Hice algo muy especial para vos ❤️</p>
  <button id="startButton">✨ Abrir mi regalo ✨</button>

  <script>
function crearCorazon(){

  const heart = document.createElement('div');

  heart.className = 'heart';

  heart.textContent = '❤';

  heart.style.left = Math.random() * 100 + 'vw';

  heart.style.animationDuration =
    (4 + Math.random() * 4) + 's';

  document.body.appendChild(heart);

  setTimeout(() => {

    heart.remove();

  }, 8000);

}

setInterval(crearCorazon, 700);	  
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const button = document.getElementById('startButton');

    button.onclick = function () {
      title.textContent = 'Nuestra historia empieza ahora ❤️';
      subtitle.textContent = 'Y muy pronto aparecerán nuestros gatitos.';
      button.style.display = 'none';
    };
  </script>

</body>
</html>
