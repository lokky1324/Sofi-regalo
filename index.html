<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Sofi ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:linear-gradient(180deg,#08122e,#101c4a);
  color:white;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  overflow:hidden;
  text-align:center;
  padding:30px;
  position:relative;
}

body::before{
  content:"";
  position:absolute;
  inset:0;
  background-image:radial-gradient(white 1px, transparent 1px);
  background-size:35px 35px;
  opacity:.35;
  animation:starsMove 30s linear infinite;
  z-index:0;
}

@keyframes starsMove{
  from{transform:translateY(0);}
  to{transform:translateY(30px);}
}

.moon{
  position:absolute;
  top:40px;
  right:30px;
  width:80px;
  height:80px;
  border-radius:50%;
  background:radial-gradient(circle,#fffbe8,#ffe8a3);
  box-shadow:0 0 30px rgba(255,240,180,.7);
  z-index:1;
}

#intro,#sceneCats{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

#sceneCats{display:none;}

h1{font-size:2.2rem;margin-bottom:18px;}

p{
  font-size:1.1rem;
  line-height:1.6;
  max-width:320px;
  margin-bottom:40px;
}

button{
  padding:16px 28px;
  border:none;
  border-radius:999px;
  background:#ff7cb3;
  color:white;
  font-size:18px;
  box-shadow:0 10px 30px rgba(255,124,179,.4);
}

.heart{
  position:fixed;
  bottom:-30px;
  color:#ff9ec7;
  font-size:22px;
  animation:floatUp linear forwards;
  opacity:.8;
  z-index:1;
  pointer-events:none;
}

@keyframes floatUp{
  from{transform:translateY(0) scale(.8);opacity:0;}
  10%{opacity:.9;}
  to{transform:translateY(-110vh) scale(1.3);opacity:0;}
}

.cats{
  position:relative;
  width:340px;
  height:220px;
}

.cat{
  position:absolute;
  bottom:10px;
  width:110px;
  height:110px;
  transition:left 2.5s ease,right 2.5s ease,transform .8s ease;
}

#catGray{left:-140px;}
#catWhite{right:-140px;}

.hug{
  transform:scale(1.08);
}

#loveText{
  margin-top:18px;
  font-size:1.2rem;
  opacity:0;
  transition:opacity 1s ease;
}

#loveText.show{
  opacity:1;
}

svg{
  width:110px;
  height:110px;
}
</style>
</head>

<body>

<div class="moon"></div>

<div id="intro">
  <h1>Sofi...</h1>
  <p>Hice algo muy especial para vos ❤️</p>
  <button id="startButton">✨ Abrir mi regalo ✨</button>
</div>

<div id="sceneCats">
  <h1>Nuestra historia ❤️</h1>

  <div class="cats">

    <div id="catGray" class="cat">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <polygon points="25,25 45,8 50,32" fill="#9da3ad"/>
        <polygon points="95,25 75,8 70,32" fill="#9da3ad"/>
        <circle cx="60" cy="60" r="38" fill="#b8bec7"/>
        <circle cx="47" cy="55" r="4" fill="#333"/>
        <circle cx="73" cy="55" r="4" fill="#333"/>
        <ellipse cx="60" cy="67" rx="5" ry="4" fill="#f7a6b8"/>
        <circle cx="42" cy="66" r="5" fill="#f7b6c7"/>
        <circle cx="78" cy="66" r="5" fill="#f7b6c7"/>
      </svg>
    </div>

    <div id="catWhite" class="cat">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <polygon points="25,25 45,8 50,32" fill="#f0f0f0"/>
        <polygon points="95,25 75,8 70,32" fill="#f0f0f0"/>
        <circle cx="60" cy="60" r="38" fill="#ffffff"/>
        <circle cx="47" cy="55" r="4" fill="#333"/>
        <circle cx="73" cy="55" r="4" fill="#333"/>
        <ellipse cx="60" cy="67" rx="5" ry="4" fill="#f7a6b8"/>
        <circle cx="42" cy="66" r="5" fill="#ffd0dd"/>
        <circle cx="78" cy="66" r="5" fill="#ffd0dd"/>
      </svg>
    </div>

  </div>

  <p id="loveText">Como ellos, yo siempre voy a elegir acercarme a vos.</p>
</div>

<script>
function crearCorazon(){
  const heart=document.createElement('div');
  heart.className='heart';
  heart.textContent='❤';
  heart.style.left=Math.random()*100+'vw';
  heart.style.animationDuration=(4+Math.random()*4)+'s';
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),8000);
}
setInterval(crearCorazon,700);

const intro=document.getElementById('intro');
const sceneCats=document.getElementById('sceneCats');
const button=document.getElementById('startButton');
const catGray=document.getElementById('catGray');
const catWhite=document.getElementById('catWhite');
const loveText=document.getElementById('loveText');

button.onclick=function(){
  intro.style.display='none';
  sceneCats.style.display='flex';

  setTimeout(()=>{
    catGray.style.left='95px';
    catWhite.style.right='95px';
  },200);

  setTimeout(()=>{
    catGray.classList.add('hug');
    catWhite.classList.add('hug');
    loveText.classList.add('show');
  },2800);
};
</script>

</body>
</html>
