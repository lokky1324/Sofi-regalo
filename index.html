<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Sofi ❤️</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  height:100vh;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(180deg,#08122e,#16235c);
  color:white;
}
.sky::before{
  content:'';
  position:absolute;
  inset:0;
  background-image:radial-gradient(white 1px, transparent 1px);
  background-size:32px 32px;
  opacity:.35;
  animation:stars 20s linear infinite;
}
@keyframes stars{
  from{transform:translateY(0);}
  to{transform:translateY(24px);}
}
.moon{
  position:absolute;
  top:28px;
  right:28px;
  width:72px;
  height:72px;
  border-radius:50%;
  background:radial-gradient(circle,#fffbe8,#ffe8a3);
  box-shadow:0 0 28px rgba(255,240,180,.65);
}
.center{
  position:relative;
  z-index:2;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:28px;
}
h1{font-size:2.1rem;margin-bottom:14px;}
p{max-width:320px;line-height:1.6;margin-bottom:28px;}
button{
  background:#ff7cb3;
  color:#fff;
  border:none;
  border-radius:999px;
  padding:16px 28px;
  font-size:18px;
  box-shadow:0 10px 30px rgba(255,124,179,.35);
}
.heart{
  position:absolute;
  bottom:-24px;
  color:#ff9ec7;
  font-size:20px;
  animation:up linear forwards;
  pointer-events:none;
}
@keyframes up{
  from{transform:translateY(0) scale(.8);opacity:0;}
  10%{opacity:.9;}
  to{transform:translateY(-110vh) scale(1.3);opacity:0;}
}
#scene{display:none;}
.cats{
  position:relative;
  width:340px;
  height:210px;
  margin:10px 0 16px;
}
.cat{
  position:absolute;
  bottom:12px;
  width:108px;
  height:108px;
  transition:left 2.4s ease,right 2.4s ease,transform .8s ease;
}
#gray{left:-130px;}
#white{right:-130px;}
.face{fill:#fff;}
.eye{fill:#333;}
.blush{fill:#f7b6c7;}
.nose{fill:#f7a6b8;}
#love{
  opacity:0;
  transition:opacity .9s ease;
}
#love.show{opacity:1;}
.bigHeart{
  position:absolute;
  left:50%;
  top:36px;
  transform:translateX(-50%) scale(0);
  font-size:34px;
  transition:transform .5s ease;
}
.bigHeart.show{
  transform:translateX(-50%) scale(1);
}
</style>
</head>
<body>
<div class="sky"></div>
<div class="moon"></div>

<div id="intro" class="center">
  <h1>Sofi...</h1>
  <p>Hice algo muy especial para vos ❤️</p>
  <button id="openBtn">✨ Abrir mi regalo ✨</button>
</div>

<div id="scene" class="center">
  <h1>Nuestra historia ❤️</h1>
  <div class="cats">
    <div class="bigHeart" id="bigHeart">💖</div>

    <div class="cat" id="gray">
      <svg viewBox="0 0 120 120">
        <polygon points="24,26 44,8 50,32" fill="#9ea5af"/>
        <polygon points="96,26 76,8 70,32" fill="#9ea5af"/>
        <circle cx="60" cy="60" r="38" fill="#b9bfc8"/>
        <circle class="eye" cx="47" cy="56" r="4"/>
        <circle class="eye" cx="73" cy="56" r="4"/>
        <ellipse class="nose" cx="60" cy="67" rx="5" ry="4"/>
        <circle class="blush" cx="42" cy="66" r="5"/>
        <circle class="blush" cx="78" cy="66" r="5"/>
      </svg>
    </div>

    <div class="cat" id="white">
      <svg viewBox="0 0 120 120">
        <polygon points="24,26 44,8 50,32" fill="#f0f0f0"/>
        <polygon points="96,26 76,8 70,32" fill="#f0f0f0"/>
        <circle cx="60" cy="60" r="38" fill="#ffffff"/>
        <circle class="eye" cx="47" cy="56" r="4"/>
        <circle class="eye" cx="73" cy="56" r="4"/>
        <ellipse class="nose" cx="60" cy="67" rx="5" ry="4"/>
        <circle class="blush" cx="42" cy="66" r="5"/>
        <circle class="blush" cx="78" cy="66" r="5"/>
      </svg>
    </div>
  </div>
  <p id="love">Como ellos, yo siempre voy a elegir acercarme a vos.</p>
</div>

<script>
function heart(){
  const h=document.createElement('div');
  h.className='heart';
  h.textContent='❤';
  h.style.left=Math.random()*100+'vw';
  h.style.animationDuration=(4+Math.random()*3)+'s';
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),7000);
}
setInterval(heart,650);

const intro=document.getElementById('intro');
const scene=document.getElementById('scene');
const gray=document.getElementById('gray');
const white=document.getElementById('white');
const love=document.getElementById('love');
const bigHeart=document.getElementById('bigHeart');

document.getElementById('openBtn').onclick=()=>{
  intro.style.display='none';
  scene.style.display='flex';

  setTimeout(()=>{
    gray.style.left='98px';
    white.style.right='98px';
  },200);

  setTimeout(()=>{
    gray.style.transform='scale(1.08)';
    white.style.transform='scale(1.08)';
    bigHeart.classList.add('show');
    love.classList.add('show');
  },2700);
};
</script>
</body>
</html>
