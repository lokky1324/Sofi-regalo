<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Sofi ❤️</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Fondo animado -->
    <div id="background">

        <div id="stars"></div>

        <div id="moon"></div>

        <div id="floating-hearts"></div>

    </div>

    <!-- Pantalla inicial -->

    <section id="intro">

        <h1 id="title"></h1>

        <p id="subtitle"></p>

        <button id="startButton">
            ✨ Abrir mi regalo ✨
        </button>

    </section>

    <!-- Escena de los gatitos (todavía oculta) -->

    <section id="catsScene" class="hidden">

    </section>

    <!-- Carta (todavía oculta) -->

    <section id="letterScene" class="hidden">

    </section>

    <!-- Música -->

    <audio id="music" loop>

        <source src="assets/music/song.mp3" type="audio/mpeg">

    </audio>

    <script src="config.js"></script>

    <script src="script.js"></script>

</body>

</html>
